org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# 显式指定 JDK 17，避免 Gradle toolchain 找不到 Java 17 导致 Sync/编译失败
org.gradle.java.home=F:/Android/jdk17
# 显式登记 JDK 安装路径，供 toolchain 自动发现（关键，java.home 不保证被 toolchain 探测到）
org.gradle.java.installations.paths=F:/Android/jdk17
